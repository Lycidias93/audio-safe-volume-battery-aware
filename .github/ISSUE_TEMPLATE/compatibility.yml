name: Compatibility report
about: Report ASVD behavior on another device/ROM
labels: compatibility
body:
  - type: markdown
    attributes:
      value: |
        Please paste the full XDA/GitHub report output:
        `tsu /system/bin/sh /data/adb/modules/audio-safe-volume-battery-aware/verify.sh --xda`

        For non-Pixel or unverified devices, also paste:
        `tsu /system/bin/sh /data/adb/modules/audio-safe-volume-battery-aware/verify.sh --compat-xda`

        Do not include unsanitized Bluetooth MAC addresses, account identifiers, tokens, or private keys.

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Pixel 10 Pro XL
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version / SDK
      placeholder: Android 16 / SDK 36
    validations:
      required: true

  - type: input
    id: root
    attributes:
      label: Root stack and version
      placeholder: Magisk e8a58776-alpha / 30700
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: verify.sh --xda output
      render: text
    validations:
      required: true

  - type: textarea
    id: compat
    attributes:
      label: verify.sh --compat-xda output
      description: Required for non-Pixel / unverified devices.
      render: text
    validations:
      required: false

  - type: dropdown
    id: playback
    attributes:
      label: Playback context
      options:
        - Speaker
        - Bluetooth headphones
        - Bluetooth car receiver
        - Android Auto
        - Other / mixed
    validations:
      required: true

  - type: textarea
    id: warning
    attributes:
      label: Warning behavior
      description: Did the warning return? Did volume actually decrease?
    validations:
      required: true

  - type: checkboxes
    id: rejected-path
    attributes:
      label: Safety acknowledgement
      options:
        - label: I understand that ASVD does not ship a GMS-disable/offline-ui helper and does not patch Bluetooth config files.
          required: true
